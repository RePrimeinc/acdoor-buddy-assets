<!-- ============================================================
     Buddy セクション（site.html の .door と .how の間に挿入）
     既存の構成・デザイントークンはそのまま使用
     ============================================================ -->
<section class="sec buddysec">
  <div class="sec-head center">
    <span class="eyebrow">YOUR BUDDY</span>
    <h2 class="bs-grad">たまごから、<br class="sp">あなただけの相棒が。</h2>
    <p class="lead">履歴書と職務経歴書がそろうと生まれます。<br>世界に一体だけのオリジナルデザイン。</p>
  </div>

  <!-- 卵が流れる（全100種類・スプライト1枚） -->
  <div class="bs-rail" aria-label="たまごの例">
    <div class="bs-track" id="bsTrack"></div>
    <span class="bs-fade l"></span><span class="bs-fade r"></span>
  </div>
<p class="bs-cap">どの卵が届くかは、<span class="nw">登録してからのお楽しみ。</span></p>

  <!-- 動くバディ -->
  <div class="bs-stage">
    <div class="bs-orb">
      <video src="assets/buddy/lp/buddy.mp4" autoplay loop muted playsinline poster="assets/buddy/lp/form1.jpg"></video>
    </div>
    <span class="bs-pool"></span>
    <div class="bs-dust" id="bsDust"></div>
  </div>

  <!-- 育つ -->
  <div class="bs-grow">
    <div class="bs-step">
      <img src="assets/buddy/lp/form1.jpg" alt="">
      <b>産まれる</b>
    </div>
    <span class="bs-arrow">→</span>
    <div class="bs-step">
      <img src="assets/buddy/lp/form2.jpg" alt="">
      <b>進化します</b>
    </div>
    <span class="bs-arrow">→</span>
    <div class="bs-step">
      <img src="assets/buddy/lp/form3.jpg" alt="">
      <b>進化は無限大</b>
    </div>
  </div>

  <p class="bs-note">
    企業からの返事や面談が決まるたび、すこしずつ育ちます。<br>
    あなたの転職が進むほど、となりの子も変わっていきます。
  </p>
</section>
